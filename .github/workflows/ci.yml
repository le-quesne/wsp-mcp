name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  menubar:
    name: Build the menu bar app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -O -o "$RUNNER_TEMP/whatsapp-status" menubar/WhatsAppStatus.swift
